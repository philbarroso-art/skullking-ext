name: Build Skull King APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: unzip -q skullking-project.zip -d extracted

      - name: Compiler APK
        working-directory: extracted/SkullKing-EXT-CLEAN
        run: gradle assembleDebug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: SkullKing-EXT-APK
          path: extracted/SkullKing-EXT-CLEAN/app/build/outputs/apk/debug/app-debug.apk
