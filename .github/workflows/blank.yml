name: Build Skull King APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q skullking-project.zip -d extracted

      - name: Verifier le projet
        run: |
          ls -la extracted/SkullKing-EXT-CLEAN
          ls -la extracted/SkullKing-EXT-CLEAN/app

      - name: Compiler APK
        working-directory: extracted/SkullKing-EXT-CLEAN
        run: gradle assembleDebug --stacktrace

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: SkullKing-EXT-APK
          path: extracted/SkullKing-EXT-CLEAN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
